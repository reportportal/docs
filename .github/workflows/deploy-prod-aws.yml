name: Deploy to prod (AWS S3)
env:
  AWS_S3_BUCKET_NAME : rpp-landing-prod
  AWS_REGION_NAME : eu-central-1
  BUILD_DIR : "build/"
  DOCS_BASE_URL: "/docs/"

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - README.md
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  clean-docs-folder:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Clear docs folder in S3 bucket
        run: |
          if aws s3 ls "s3://${{ env.AWS_S3_BUCKET_NAME }}/docs/" 2>/dev/null; then
            echo "docs/ folder exists, removing it..."
            aws s3 rm s3://${{ env.AWS_S3_BUCKET_NAME }}/docs/ --recursive
          else
            echo "docs/ folder does not exist, nothing to clean."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [clean-docs-folder]
    environment: production
    outputs:
      amplify_job_id: ${{ steps.amplify.outputs.job_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Pull latest changes
        run: git pull origin master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install of node dependencies
        run: npm ci

      - name: create env file
        run: |
          touch .env
          echo DOCS_BASE_URL=${{ env.DOCS_BASE_URL }} >> .env

      - name: Build the source code
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Deploy to AWS S3
        run: aws s3 sync ./${{ env.BUILD_DIR }} s3://${{ env.AWS_S3_BUCKET_NAME }}/docs/

      - name: Trigger Amplify redeploy
        id: amplify
        run: |
          aws s3 sync s3://${{ env.AWS_S3_BUCKET_NAME }} /tmp/full-site

          DEPLOY_RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AWS_AMPLIFY_APP_ID }} \
            --branch-name production)

          JOB_ID=$(echo "$DEPLOY_RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$DEPLOY_RESULT" | jq -r '.zipUploadUrl')

          cd /tmp/full-site
          zip -r /tmp/deploy.zip .

          curl --fail -T /tmp/deploy.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AWS_AMPLIFY_APP_ID }} \
            --branch-name production \
            --job-id "$JOB_ID"

          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"

  wait-amplify:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Wait for Amplify deployment
        env:
          AWS_AMPLIFY_APP_ID: ${{ secrets.AWS_AMPLIFY_APP_ID }}
          AMPLIFY_JOB_ID: ${{ needs.deploy.outputs.amplify_job_id }}
        run: |
          TIMEOUT_SECONDS=900
          INTERVAL_SECONDS=15
          elapsed=0

          while [ "$elapsed" -lt "$TIMEOUT_SECONDS" ]; do
            STATUS=$(aws amplify get-job \
              --app-id "${AWS_AMPLIFY_APP_ID}" \
              --branch-name production \
              --job-id "${AMPLIFY_JOB_ID}" \
              --query 'job.summary.status' \
              --output text)

            echo "Amplify job ${AMPLIFY_JOB_ID} status: ${STATUS} (${elapsed}s)"

            case "${STATUS}" in
              SUCCEED)
                echo "Amplify deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED|CANCELLING)
                echo "::error::Amplify deployment ${STATUS}."
                exit 1
                ;;
            esac

            sleep "${INTERVAL_SECONDS}"
            elapsed=$((elapsed + INTERVAL_SECONDS))
          done

          echo "::error::Timed out waiting for Amplify job ${AMPLIFY_JOB_ID}."
          exit 1

  start-algolia-crawler:
    needs: wait-amplify
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    steps:
      - name: Start Algolia crawler reindex
        env:
          USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
        run: |
          CREDENTIALS=$(printf '%s' "${USER_ID}:${API_KEY}" | base64 -w 0)

          curl --fail-with-body -X POST \
            -H "Authorization: Basic ${CREDENTIALS}" \
            "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/reindex"

  merge-to-develop:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Merge master into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin develop:develop 2>/dev/null; then
            echo "::warning::develop branch not found, skipping merge."
            exit 0
          fi
          if git diff --quiet develop..master; then
            echo "No differences between master and develop, skipping merge."
            exit 0
          fi
          git checkout develop
          if ! git merge --no-ff master -m "Sync || merge master into develop"; then
            echo "::error::Merge conflict detected when merging master into develop."
            git merge --abort
            exit 1
          fi
          git push origin develop
